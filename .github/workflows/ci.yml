name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # The published tarball must be installable and contain the patch layer.
      - run: pnpm pack --pack-destination /tmp && tar -tzf /tmp/dsh-ros2-*.tgz | grep -E "cordis.patch.yml|lib/index.js|lib/types/index.d.ts"
