name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # Every bundle tarball must be installable and contain its patch layer;
      # dsh-ros2-common must carry the shared robot_profile.py script.
      - run: |
          for p in core profile moveit safety vision dsh-ros2; do
            (cd packages/$p && pnpm pack --pack-destination /tmp >/dev/null && tar -tzf /tmp/dsh-ros2-${p}-*.tgz | grep -qE "cordis.patch.yml|lib/index.js")
            echo "$p tarball OK"
          done
          (cd packages/common && pnpm pack --pack-destination /tmp >/dev/null && tar -tzf /tmp/dsh-ros2-common-*.tgz | grep -q "scripts/robot_profile.py")
          echo "common tarball OK"
