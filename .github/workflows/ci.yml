name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo and runs the checks.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0  # must match the root package.json packageManager field
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Supply-chain gate: the runtime dependency graph must be free of
      # high/critical advisories (dev-only tooling such as vitest is out of scope).
      - run: pnpm audit --prod --audit-level high
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build
      # Every bundle tarball must be installable and contain its patch layer;
      # dsh-ros2-common must carry the shared robot_profile.py script.
      - run: |
          for p in core profile moveit safety vision dsh-ros2; do
            tgz=$(cd packages/$p && pnpm pack --pack-destination /tmp | tail -1)
            tar -tzf "$tgz" | grep -qE "cordis.patch.yml|lib/index.js"
            echo "$p tarball OK ($tgz)"
          done
          tgz=$(cd packages/common && pnpm pack --pack-destination /tmp | tail -1)
          tar -tzf "$tgz" | grep -q "scripts/robot_profile.py"
          echo "common tarball OK ($tgz)"
