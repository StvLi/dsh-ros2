# Dependabot VERSION updates.
#
# Round 13 enabled the repository's alerting side (Dependabot alerts +
# automated security fixes) via the API, but alerts only fire on a *known
# advisory*. Version updates need this file, and without it two things stayed
# manual:
#
#   github-actions — the workflows pin mutable major tags
#     (`actions/checkout@v7`, `pnpm/action-setup@v6`, `actions/setup-node@v7`).
#     A major tag is a moving ref, so the only way to notice a new major (or a
#     re-pointed tag) was to look. The last bump, commit 618bdbe "ci: bump
#     Actions to node24 majors", was done by hand.
#   npm — CI gates the runtime graph with `pnpm audit --prod --audit-level high`,
#     which catches advisories but opens no upgrades for anything else.
#
# Weekly and uncapped-by-noise: five PRs per ecosystem is enough for a repo this
# size, and every PR still has to pass the normal CI (typecheck + test + build +
# the publish-surface gate) before it can merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Version updates are ignored for packages whose correct version is set by
    # the HOST, not by npm. The rule and its measurements live in
    # docs/dependency-policy.md (decided in issue #56); this list is the
    # mechanical half, so the same three PRs do not reopen every week.
    ignore:
      # Host-supplied contracts. Declaring a floor above what the running
      # harness provides is a false contract, and CI cannot tell us otherwise:
      # it installs the very version the Dependabot PR raises the floor to, so
      # a green run means "the code builds against 4.0.4", never "4.0.4 is the
      # right floor". Bump these by hand when the harness moves.
      - dependency-name: "@deepseek-ai/cordis"
      - dependency-name: "@deepseek-ai/dsh-skill"
      - dependency-name: "@deepseek-ai/dsh-tools"
      # Runtime stand-in types must track the `engines` floor (^22.19.0), not
      # the newest major: typing against a newer Node lets a Node-26-only API
      # pass typecheck and then TypeError on the oldest supported runtime.
      # Patch/minor inside 22.x are still allowed through.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
